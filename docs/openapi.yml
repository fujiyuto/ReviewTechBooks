openapi: 3.0.0
info:
  title: 技術書レビュープラットフォーム API
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: 開発環境

paths:
  /api/users:
    post:
      summary: ユーザー登録
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authId
                - username
              properties:
                authId:
                  type: string
                  format: uuid
                  description: Supabase Auth ID
                username:
                  type: string
                  maxLength: 20
                  description: ユーザー名
                lastName:
                  type: string
                  maxLength: 50
                  description: 名前（姓）
                firstName:
                  type: string
                  maxLength: 50
                  description: 名前（名）
      responses:
        '201':
          description: 登録成功
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/users/{userId}:
    get:
      summary: ユーザー詳細取得
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: ユーザー編集
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 20
                  description: ユーザー名
                lastName:
                  type: string
                  maxLength: 50
                  description: 名前（姓）
                firstName:
                  type: string
                  maxLength: 50
                  description: 名前（名）
                biography:
                  type: string
                  description: 自己紹介
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: ユーザー削除
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ユーザーを削除しました
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/reviews:
    get:
      summary: ユーザーのレビュー一覧取得
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReview'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  next:
                    type: boolean
                    description: 次のページが存在するか
                  prev:
                    type: boolean
                    description: 前のページが存在するか
        '404':
          $ref: '#/components/responses/NotFound'

  /api/books:
    get:
      summary: 書籍一覧取得
      tags: [Books]
      parameters:
        - $ref: '#/components/parameters/Title'
        - $ref: '#/components/parameters/Author'
        - $ref: '#/components/parameters/PublishedBy'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookSummary'
                  total:
                    type: integer
                  currentPage:
                    type: integer
                  totalPages:
                    type: integer
                    description: 総ページ数
                  limit:
                    type: integer
                  next:
                    type: boolean
                    description: 次のページが存在するか
                  prev:
                    type: boolean
                    description: 前のページが存在するか

  /api/books/{bookId}:
    get:
      summary: 書籍詳細取得
      tags: [Books]
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/books/{bookId}/reviews:
    get:
      summary: 書籍のレビュー一覧取得
      tags: [Reviews]
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  next:
                    type: boolean
                    description: 次のページが存在するか
                  prev:
                    type: boolean
                    description: 前のページが存在するか
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reviews:
    post:
      summary: レビュー投稿
      tags: [Reviews]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookId
                - title
                - content
              properties:
                bookId:
                  type: integer
                  format: int64
                  description: 書籍ID
                title:
                  type: string
                  maxLength: 100
                  description: レビュータイトル
                content:
                  type: string
                  description: レビュー内容
                categoryIds:
                  type: array
                  items:
                    type: integer
                  description: カテゴリIDのリスト
      responses:
        '201':
          description: 投稿成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookId:
                    type: integer
                    format: int64
                    description: 書籍ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/reviews/{reviewId}:
    patch:
      summary: レビュー編集
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: レビュータイトル
                content:
                  type: string
                  description: レビュー内容
                categoryIds:
                  type: array
                  items:
                    type: integer
                  description: カテゴリIDのリスト
      responses:
        '200':
          description: 更新成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: レビュー削除
      tags: [Reviews]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: レビューを削除しました
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/categories:
    get:
      summary: カテゴリ取得
      tags: [Categories]
      parameters:
        - $ref: '#/components/parameters/FeatureName'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryTypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryType'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FeatureName:
      name: feature_name
      in: query
      required: true
      description: 機能名（例：review、user）
      schema:
        type: string
    Title:
      name: title
      in: query
      description: 書籍名
      schema:
        type: string
    Author:
      name: author
      in: query
      description: 著者名
      schema:
        type: string
    PublishedBy:
      name: publishedBy
      in: query
      description: 出版社名
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: category_id
      in: query
      description: カテゴリIDによる絞り込み
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 権限エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: リソースが見つからない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        biography:
          type: string
        role:
          type: string
          enum: [free, premium]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        publishedBy:
          type: string
        releaseDate:
          type: string
          format: date
        thumbnailUrl:
          type: string

    BookDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn:
          type: string
        title:
          type: string
        subtitle:
          type: string
        author:
          type: string
        publishedBy:
          type: string
        numberOfPages:
          type: integer
        regularPrice:
          type: integer
        includeTaxPrice:
          type: integer
        releaseDate:
          type: string
          format: date
        description:
          type: string
        thumbnailUrl:
          type: string

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          type: object
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
        title:
          type: string
        content:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserReview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        book:
          type: object
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            thumbnailUrl:
              type: string
        title:
          type: string
        content:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        order:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string